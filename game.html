<!DOCTYPE html>
<html>
    <head>

        <meta charset="UTF-8">
        <link rel="stylesheet" href="style.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

    </head>

    <body>
        <!-- 블록 배치 위치 지정 -->
        <svg viewBox="-265 -40 700 240" style="position:relative;top:0;left:0;width:100%;height:100%" xmlns="http://www.w3.org/2000/svg">

            <!-- 블록 배치 -->
            <rect x="0" y="0" width="50" height="50" rx="10" class="box" id="1"/>
            <rect x="60" y="0" width="50" height="50" rx="10" class="box" id="2"/>
            <rect x="120" y="0" width="50" height="50" rx="10" class="box" id="3"/>
            <rect x="0" y="60" width="50" height="50" rx="10" class="box" id="4"/>
            <rect x="60" y="60" width="50" height="50" rx="10" class="box" id="5"/>
            <rect x="120" y="60" width="50" height="50" rx="10" class="box" id="6"/>
            <rect x="0" y="120" width="50" height="50" rx="10" class="box" id="7"/>
            <rect x="60" y="120" width="50" height="50" rx="10" class="box" id="8"/>
            <rect x="120" y="120" width="50" height="50" rx="10" class="box" id="9"/>

        </svg>
             
            <!-- 정답 버튼 배치 -->
        <div class="container center">
            <button type="button" onclick="place_check();" class="normal_button1" id="bt1">위치가 같다</button>
            <button type="button" onclick="sound_check();" class="normal_button2" id="bt2">소리가 같다</button>
        </div>

            <!-- 줄바꿈 -->
        <h3>
        </h3>

            <!-- 시작 버튼 배치 -->
        <div class="container center">
            <button type="button" onclick="game_start();" class="start_button" id="stBt">시작하기</button>
        </div>
    </body>

    <script>

        /// n값 불러오기
        const queryString = window.location.search;

        const urlParams = new URLSearchParams(queryString);

        const n = urlParams.get('n');

        /// 시간 관련 변수 지정
        const start_time = new Date();
        var now_time = new Date();
        var diffTime = 0

        /// 결과 관련 변수 지정
        var place_correct = 0;
        var place_incorrect = 0;
        var place_lost = 0;
        var sound_correct = 0;
        var sound_incorrect = 0;
        var sound_lost = 0;

        ///버튼 클릭 가능 변수 지정(연속 클릭 방지 및 놓친 정답 확인용)
        var can_place_button_click = 0;
        var can_sound_button_click = 0;

        /// 박스들을 ID로 지정
        const box1 = document.getElementById("1");
        const box2 = document.getElementById("2");
        const box3 = document.getElementById("3");
        const box4 = document.getElementById("4");
        const box5 = document.getElementById("5");
        const box6 = document.getElementById("6");
        const box7 = document.getElementById("7");
        const box8 = document.getElementById("8");
        const box9 = document.getElementById("9");

        /// 버튼을 ID로 지정
        const bt1 = document.getElementById("bt1");
        const bt2 = document.getElementById("bt2");

        /// 소리 관련 변수 지정
        const speech = new SpeechSynthesisUtterance()
        speech.lang = 'en-US';
        speech.volume = 1;
        speech.rate = 1;
        speech.pitch = 1;

        /// 기본 배열 설정
        if (n == 1){
            var recent_place = new Array(11, 12);
            var recent_sound = new Array(11, 12);}
        else if (n == 2){
            var recent_place = new Array(11, 12, 13);
            var recent_sound = new Array(11, 12, 13);}

        ////// 다음 위치 및 소리 지정과 표시
        function change(){

            /// 놓친 위치 정답 확인
            if (can_place_button_click == 1 && recent_place[0] == recent_place.at(-1)){
                place_lost += 1 
            }
            
            /// 놓친 소리 정답 확인
            if (can_sound_button_click == 1 && recent_sound[0] == recent_sound.at(-1)){
                sound_lost += 1 
            }

            /// 위치 및 소리 뽑기
            var placeNum = Math.floor(Math.random() * 9 + 1);
            var soundNum = Math.floor(Math.random() * 4 + 1);

            /// 버튼 모양 초기화
            bt1.setAttribute("class", "normal_button1")
            bt2.setAttribute("class", "normal_button2")

            /// 박스 모양 초기화
            box1.setAttribute("class", "box")
            box2.setAttribute("class", "box")
            box3.setAttribute("class", "box")
            box4.setAttribute("class", "box")
            box5.setAttribute("class", "box")
            box6.setAttribute("class", "box")
            box7.setAttribute("class", "box")
            box8.setAttribute("class", "box")
            box9.setAttribute("class", "box")

            /// 위치에 따라 박스 바꾸기
            if (placeNum == 1){
                box1.setAttribute("class", "changed_box")}
            else if (placeNum == 2){
                box2.setAttribute("class", "changed_box")}
            else if (placeNum == 3){
                box3.setAttribute("class", "changed_box")}
            else if (placeNum == 4){
                box4.setAttribute("class", "changed_box")}
            else if (placeNum == 5){
                box5.setAttribute("class", "changed_box")}
            else if (placeNum == 6){
                box6.setAttribute("class", "changed_box")}
            else if (placeNum == 7){
                box7.setAttribute("class", "changed_box")}
            else if (placeNum == 8){
                box8.setAttribute("class", "changed_box")}
            else if (placeNum == 9){
                box9.setAttribute("class", "changed_box")}

            /// 정해진 소리 출력
            if (soundNum == 1){
                speech.text = 'A';}
            else if (soundNum == 2){
                speech.text = 'B';}
            else if (soundNum == 3){
                speech.text = 'C';}
            else if (soundNum == 4){
                speech.text = 'D';}
            window.speechSynthesis.speak(speech);

            /// 위치와 소리 배열 수정 
            recent_place.shift()
            recent_place.push(placeNum)
            recent_sound.shift()
            recent_sound.push(soundNum)

            /// 버튼 클릭 가능
            can_place_button_click = 1;
            can_sound_button_click = 1;
        }

        ////// 위치 정답 확인
        const place_check = ()  => {
            /// 위치 버튼이 클릭 가능하고
            if (can_place_button_click){
                /// 지금의 위치가 N번째 전의 위치와 같다면
                if (recent_place[0] == recent_place.at(-1)){
                    /// 위치 정답 +1, 버튼 초록색
                    place_correct += 1;
                    bt1.setAttribute("class", "correct_button1")
                }
                /// 아니라면
                else if(1){
                    /// 위치 오답 +1, 버튼 빨간색
                    place_incorrect += 1;
                    bt1.setAttribute("class", "incorrect_button1")
                }
                can_place_button_click = 0;
            }
        }

        ////// 소리 정답 확인
        const sound_check = ()  => {
            /// 소리 버튼이 클릭 가능하고
            if (can_sound_button_click){
                /// 지금의 소리가 N번째 전의 소리와 같다면
                if (recent_sound[0] == recent_sound.at(-1)){
                    /// 소리 정담 +1, 버튼 초록색
                    sound_correct += 1;
                    bt2.setAttribute("class", "correct_button2")
                }
                /// 아니라면
                else if(1){
                    /// 위치오답 +1, 버튼 빨간색
                    sound_incorrect += 1;
                    bt2.setAttribute("class", "incorrect_button2")
                }
                can_sound_button_click = 0;
            }
        }

        ////// 결과 창 띄우기
        function result(){
            /// 창 이동, 정답 관련 변수 전송
            window.location.href = `result.html?place_correct=${place_correct}&place_incorrect=${place_incorrect}&place_lost=${place_lost}
            &sound_correct=${sound_correct}&sound_incorrect=${sound_incorrect}&sound_lost=${sound_lost}`;
        }  

        ////// 게임 시작
        const game_start = () => {
            /// 시작 버튼 비활성화
            const target = document.getElementById('stBt');
            target.disabled = true;

            /// 횟수 변수 지정
            let count = 0;

            /// 게임 플래이(2.4초마다 20번)
            const timer = setInterval(() => {
                change();
                count++;

                if(count >= 20){
                    clearInterval(timer);
                    result();
                }
            }, 2400);
        }

    </script>

</html>
